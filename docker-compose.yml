services:
  heart-api:
    image: 'node:lts-alpine'
    user: node
    working_dir: /home/node/app/dist
    ports:
      - '443:443'
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0 # lets non-root user bind to ports 80 and 443
    restart: always
    volumes:
      - './dist:/home/node/app/dist:ro'
    command: node --env-file=.env --enable-source-maps app.mjs
    deploy:
      resources:
        limits:
          memory: 200M
    labels:
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "nodejs",
          "service": "heart-api",
          "auto_multi_line_detection": true,
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "/api/v1/status"
          }]
        }]
      com.datadoghq.tags.env: 'prod'
      com.datadoghq.tags.service: 'heart-api'
